<html lang="pt-BR">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>My Sweets Brazilian</title>
<meta name="description" content="Faça seu pedido pelo WhatsApp ou siga a gente no Instagram! / Order on WhatsApp or follow us on Instagram.">
<style>
  :root{--brown:#5a2a17;--bg:#f3d9cc}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:#2b1a12;display:flex;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .screen{position:relative;width:100%;max-width:440px;min-height:100svh;overflow:hidden;background:var(--bg) url(foto.jpg) center top/cover no-repeat;display:flex;flex-direction:column;justify-content:flex-end}
  .screen::before{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(255,240,235,0) 38%,rgba(255,240,235,.55) 58%,rgba(255,244,240,.96) 78%)}
  .content{position:relative;z-index:1;padding:0 22px calc(28px + env(safe-area-inset-bottom));text-align:center}
  .logo{display:block;width:min(78%,300px);margin:0 auto 10px;filter:drop-shadow(0 2px 6px rgba(255,255,255,.7))}
  .sub{margin:0 0 18px;font-size:15px;color:var(--brown);line-height:1.35}
  .btn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;padding:17px 20px;margin:12px 0;border-radius:999px;text-decoration:none;font-weight:700;font-size:18px;color:#fff;box-shadow:0 8px 20px rgba(60,30,15,.25);transition:transform .15s}
  .btn:active{transform:scale(.97)}
  .btn svg{width:26px;height:26px;fill:#fff;flex:none}
  .btn span{text-align:left;line-height:1.2}
  .btn small{display:block;font-weight:500;font-size:13px;opacity:.95}
  .wa{background:#25D366}
  .ig{background:linear-gradient(45deg,#f09433,#e6683c 30%,#dc2743 55%,#cc2366 75%,#bc1888)}
</style>
</head>
